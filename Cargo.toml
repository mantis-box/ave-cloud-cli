[package]
name = "ave-cloud-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip"] }
tokio-tungstenite = { version = "0.21" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
zeroize = "1"

# Chain wallet dependencies (FASE 8)
k256 = { version = "0.11", features = ["std"] }
# Solana integration deferred due to dependency conflicts
# Will be added in a future update

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
