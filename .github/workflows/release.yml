name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Test
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

  # ==========================================================================
  # Build
  # ==========================================================================
  build:
    name: Build ${{ matrix.target }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilers
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf

      - name: Configure linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      - name: Configure linker
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> $GITHUB_ENV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cross-compiler strip
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf

      - name: Strip binary
        run: |
          case '${{ matrix.target }}' in
            aarch64-*) aarch64-linux-gnu-strip target/${{ matrix.target }}/release/ave-cloud-rs-cli ;;
            armv7-*) arm-linux-gnueabihf-strip target/${{ matrix.target }}/release/ave-cloud-rs-cli ;;
            *) strip target/${{ matrix.target }}/release/ave-cloud-rs-cli ;;
          esac

      - name: Rename binary with architecture
        run: |
          cp target/${{ matrix.target }}/release/ave-cloud-rs-cli \
             target/${{ matrix.target }}/release/ave-cloud-rs-cli-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ave-cloud-rs-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ave-cloud-rs-cli-${{ matrix.target }}
          retention-days: 5

  # ==========================================================================
  # Create Release
  # ==========================================================================
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name 'ave-cloud-rs-cli-*' -type f -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/ave-cloud-rs-cli-x86_64-unknown-linux-gnu/ave-cloud-rs-cli-x86_64-unknown-linux-gnu
            artifacts/ave-cloud-rs-cli-aarch64-unknown-linux-gnu/ave-cloud-rs-cli-aarch64-unknown-linux-gnu
            artifacts/ave-cloud-rs-cli-armv7-unknown-linux-gnueabihf/ave-cloud-rs-cli-armv7-unknown-linux-gnueabihf
            artifacts/ave-cloud-rs-cli-x86_64-unknown-linux-musl/ave-cloud-rs-cli-x86_64-unknown-linux-musl
            artifacts/checksums.txt
            scripts/install.sh
          generate_release_notes: true

  # ==========================================================================
  # Docker
  # ==========================================================================
  docker:
    name: Build Docker
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
